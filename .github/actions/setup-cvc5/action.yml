name: Setup cvc5
description: Build and cache cvc5 (static, and optionally dynamic)

inputs:
  build-dynamic:
    description: Also build the dynamic-linking variant of cvc5
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install build dependencies (Ubuntu)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake

    - name: Install build dependencies (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: brew install cmake

    - name: Patch FindPoly.cmake for Apple Clang 21+
      shell: bash
      run: |
        python3 - cvc5-sys/cvc5/cmake/FindPoly.cmake <<'PY'
        import pathlib, sys

        path = pathlib.Path(sys.argv[1])
        if not path.exists():
            sys.exit(f"error: {path} does not exist")
        text = path.read_text()

        OLD = (
            '  set(POLY_CXX_FLAGS "")\n'
            '  if(NOT(WASM STREQUAL "OFF"))\n'
            '    set(POLY_CXX_FLAGS -DCMAKE_CXX_FLAGS='
            '-Wno-error=deprecated-literal-operator)\n'
            '  endif()'
        )
        NEW = '  set(POLY_CXX_FLAGS -DCMAKE_CXX_FLAGS=-Wno-deprecated-literal-operator)'

        if NEW in text:
            print("already patched; nothing to do")
        elif OLD in text:
            path.write_text(text.replace(OLD, NEW))
            print("patched: POLY_CXX_FLAGS is now set unconditionally")
        elif "check_cxx_compiler_flag(-Wno-error=deprecated-literal-operator" in text:
            print("upstream compiler-flag test present; no patch needed")
        else:
            sys.exit(
                "error: FindPoly.cmake matches none of the known forms, so the "
                "Apple Clang 21+ workaround was NOT applied. Re-check this patch "
                "after bumping the cvc5 submodule. "
                "See https://github.com/cvc5/cvc5-rs/issues/56"
            )
        PY

    - name: Resolve cvc5 revision
      id: cvc5rev
      shell: bash
      run: |
        echo "sha=$(git -C cvc5-sys/cvc5 rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Cache cvc5 build (static)
      uses: actions/cache@v4
      id: cache-static
      with:
        path: cvc5-sys/cvc5/build
        key: ${{ runner.os }}-cvc5-static-${{ steps.cvc5rev.outputs.sha }}-${{ hashFiles('.github/actions/setup-cvc5/action.yml') }}

    - name: Build cvc5 (static)
      if: steps.cache-static.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cd cvc5-sys/cvc5
        ./configure.sh --static --auto-download --prefix=$(pwd)/build/install -DBUILD_GMP=1
        cd build
        make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
        make install

    - name: Cache cvc5 build (dynamic)
      if: inputs.build-dynamic == 'true'
      uses: actions/cache@v4
      id: cache-dynamic
      with:
        path: cvc5-sys/cvc5/build-dynamic
        key: ${{ runner.os }}-cvc5-dynamic-${{ steps.cvc5rev.outputs.sha }}-${{ hashFiles('.github/actions/setup-cvc5/action.yml') }}

    - name: Build cvc5 (dynamic)
      if: inputs.build-dynamic == 'true' && steps.cache-dynamic.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cd cvc5-sys/cvc5
        ./configure.sh --name=build-dynamic --auto-download --prefix=$(pwd)/build-dynamic/install -DBUILD_GMP=1
        cd build-dynamic
        make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
        make install
