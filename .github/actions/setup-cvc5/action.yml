name: Setup cvc5
description: Build and cache cvc5 (static, and optionally dynamic)

inputs:
  build-dynamic:
    description: Also build the dynamic-linking variant of cvc5
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install build dependencies (Ubuntu)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake

    - name: Install build dependencies (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: brew install cmake

    - name: Cache cvc5 build (static)
      uses: actions/cache@v4
      id: cache-static
      with:
        path: cvc5-sys/cvc5/build
        key: ${{ runner.os }}-cvc5-${{ hashFiles('cvc5-sys/cvc5/**/*.cmake', 'cvc5-sys/cvc5/CMakeLists.txt') }}

    - name: Patch FindPoly.cmake for Apple Clang 21+
      if: steps.cache-static.outputs.cache-hit != 'true'
      shell: bash
      run: |
        # Apple Clang 21+ (macOS 26+) errors on the deprecated
        # whitespace-before-suffix syntax in gmpxx.h literal operators.
        # libpoly builds with -Werror, so the warning becomes fatal.
        # The existing cmake only suppresses this for WASM builds;
        # make it unconditional using the strong -Wno- form.
        # See https://github.com/cvc5/cvc5-rs/issues/56
        F=cvc5-sys/cvc5/cmake/FindPoly.cmake
        python3 -c "
        import pathlib, sys
        f = pathlib.Path('$F')
        if not f.exists():
            sys.exit(0)
        t = f.read_text()
        old = 'set(POLY_CXX_FLAGS \"\")\n  if(NOT(WASM STREQUAL \"OFF\"))\n    set(POLY_CXX_FLAGS -DCMAKE_CXX_FLAGS=-Wno-error=deprecated-literal-operator)\n  endif()'
        new = 'set(POLY_CXX_FLAGS -DCMAKE_CXX_FLAGS=-Wno-deprecated-literal-operator)'
        if old in t:
            f.write_text(t.replace(old, new))
            print('Patched FindPoly.cmake')
        "

    - name: Build cvc5 (static)
      if: steps.cache-static.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cd cvc5-sys/cvc5
        ./configure.sh --static --auto-download --prefix=$(pwd)/build/install -DBUILD_GMP=1
        cd build
        make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
        make install

    - name: Cache cvc5 build (dynamic)
      if: inputs.build-dynamic == 'true'
      uses: actions/cache@v4
      id: cache-dynamic
      with:
        path: cvc5-sys/cvc5/build-dynamic
        key: ${{ runner.os }}-cvc5-dynamic-${{ hashFiles('cvc5-sys/cvc5/**/*.cmake', 'cvc5-sys/cvc5/CMakeLists.txt') }}

    - name: Build cvc5 (dynamic)
      if: inputs.build-dynamic == 'true' && steps.cache-dynamic.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cd cvc5-sys/cvc5
        ./configure.sh --name=build-dynamic --auto-download --prefix=$(pwd)/build-dynamic/install -DBUILD_GMP=1
        cd build-dynamic
        make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
        make install
